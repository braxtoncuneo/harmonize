# =============================================================================
# Release
# =============================================================================
# Publishing a GitHub release builds the sdist and wheel and uploads them to
# PyPI. Running this workflow by hand uploads them to TestPyPI instead, as a
# dry run. See CONTRIBUTING.md, "Making a release".
#
# Uploads use PyPI's trusted publishing, so no token is stored. One-time setup:
#   - On pypi.org and test.pypi.org, add a trusted publisher for the project
#     harmonize-python: owner harmonize-software, repository harmonize,
#     workflow release.yml, environment pypi (PyPI) or testpypi (TestPyPI).
#   - In this repository, create the environments pypi and testpypi
#     (Settings -> Environments); add required reviewers to pypi if wanted.
# =============================================================================

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Check that the release tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match the version in pyproject.toml (v$version)"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/harmonize-python' || 'https://test.pypi.org/p/harmonize-python' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Upload to ${{ github.event_name == 'release' && 'PyPI' || 'TestPyPI' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # TestPyPI also refuses to replace a version, so repeated dry runs skip it
          skip-existing: ${{ github.event_name != 'release' }}
