# =============================================================================
# Documentation
# =============================================================================
# Builds the documentation site (docs/build.sh) on every pull request and push
# to main, and publishes it to GitHub Pages from main only.
#
# Publishing requires Settings -> Pages -> Source: "GitHub Actions".
# =============================================================================

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      # Sphinx imports harmonize to read its docstrings; no GPU is needed.
      - name: Install Doxygen, Harmonize, and the Sphinx tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends doxygen
          python -m pip install . -r docs/requirements.txt

      - name: Build the site
        run: docs/build.sh

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
