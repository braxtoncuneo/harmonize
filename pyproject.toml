[build-system]

# 1.27 adds PEP 639 license metadata
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"



[project]
# The PyPI name "harmonize" belongs to an unrelated project; the import name is
# still `harmonize`.
name = "harmonize-python"
version = "0.0.1"
authors = [
  { name="Braxton Cuneo", email="bcuneo@seattleu.edu" },
  { name="Joanna Morgan", email="morgajoa@oregonstate.edu" },
]

maintainers = [
    { name="Braxton Cuneo", email="bcuneo@seattleu.edu" },
]

description = "Harmonize, an async GPU scheduler"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["HPC", "GPU"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    'Intended Audience :: Science/Research',
    'Typing :: Typed',
    'Natural Language :: English',
    'Operating System :: Unix',
]

dependencies = [
    "numba>=0.58.0",
    "numpy",
    "colorama",
    "cffi",
]

# GPU backends.
#
# The CUDA extras install Numba's CUDA backend for one CUDA major version.
# Harmonize also needs that version's nvcc (from the system, a module, or
# conda's cuda-nvcc).
#
# AMD's numba-hip is installed separately for a specific
# ROCm release; `python -m harmonize check` prints the command.
[project.optional-dependencies]
cuda12 = ["numba-cuda[cu12]>=0.30"]
cuda13 = ["numba-cuda[cu13]>=0.30"]
dev = ["black"]

[project.urls]
Repository = "https://github.com/CEMeNT-PSAAP/harmonize"
Issues = "https://github.com/CEMeNT-PSAAP/harmonize/issues"


[tool.hatch.build.targets.wheel]
# Hatchling would otherwise look for a package named after the project
# (harmonize_python). harmonize/cpp holds the C++ headers, used at run time.
packages = ["harmonize"]
