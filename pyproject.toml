[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"



[project]
name = "harmonize"
version = "0.0.1"
authors = [
  { name="Braxton Cuneo", email="bcuneo@seattleu.edu" },
  { name="Joanna Morgan", email="morgajoa@oregonstate.edu" },
]

maintainers = [
    { name="Braxton Cuneo", email="bcuneo@seattleu.edu" },
]

description = "Harmonize, an async GPU scheduler"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
keywords = ["HPC", "GPU"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    'License :: OSI Approved :: BSD License',
    'Intended Audience :: Science/Research',
    'Typing :: Typed',
    'Natural Language :: English',
    'Operating System :: Unix',
]

dependencies = [
    "numba>=0.58.0",
    "numpy",
    "colorama",
    "cffi",
]

# GPU backends.
#
# The CUDA extras install Numba's CUDA backend for one CUDA major version.
# Harmonize also needs that version's nvcc (from the system, a module, or
# conda's cuda-nvcc).
#
# AMD's numba-hip is installed separately for a specific
# ROCm release; `python -m harmonize check` prints the command.
[project.optional-dependencies]
cuda12 = ["numba-cuda[cu12]>=0.30"]
cuda13 = ["numba-cuda[cu13]>=0.30"]
dev = ["black"]

[project.urls]
Repository = "https://github.com/CEMeNT-PSAAP/harmonize"
Issues = "https://github.com/CEMeNT-PSAAP/harmonize/issues"